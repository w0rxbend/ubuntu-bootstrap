# gnome-extensions.yaml - GNOME Shell extensions carried over from the Fedora/Arch setup (optional module).
#
# Run alone:   ./bootstrap.sh --only gnome-extensions
# Contents:    gnome-extensions-cli (`gext`, via pipx) and six extensions installed from extensions.gnome.org:
#              user-theme, battery-indicator-icon, notification-icons, tophat, space-bar, AlphabeticalAppGrid.
# Excluded:    dash-to-dock (conflicts with the Zorin Taskbar), tilingshell (tiling layout, not wanted on Zorin),
#              appindicator and status-icons (Zorin already ships and enables them).
# Caveats:     - Must run inside the logged-in GNOME session: gext and `gnome-extensions` talk to gnome-shell
#                over the session D-Bus. It does not work over SSH or from a TTY.
#              - pipx must be installed (00-base) and on fluxion's PATH; fluxion must be started with
#                ~/.local/bin on PATH (bootstrap.sh exports it) so a freshly installed gext is found.
#              - `gext -F install` uses the filesystem backend: it unpacks the extensions.gnome.org build for
#                this shell into ~/.local/share/gnome-shell/extensions/<uuid>, compiles its schemas and adds it to
#                org.gnome.shell enabled-extensions. Plain `gext install` would use the D-Bus backend, which
#                makes GNOME Shell show a confirmation dialog and blocks the unattended run until clicked.
#              - GNOME Shell (Wayland) only loads the new extensions after log out/in, and until then
#                `gnome-extensions info` does not know them, so the probes check the files and gsettings.
apiVersion: initkit.io/v1alpha1
kind: WorkstationProfile
metadata:
  name: zorin-gnome-extensions
  labels: { distro: zorin, module: gnome-extensions }
spec:
  target:
    os: { distribution: ubuntu, codename: noble, release: "24.04" }
  phases:
    - name: host-check
      steps:
        - name: gnome-extensions-host-check
          kind: assert
          spec:
            command: "command -v apt-get >/dev/null && grep -q '^VERSION_CODENAME=noble' /etc/os-release"
            message: "This profile targets Zorin OS 18 / Ubuntu 24.04 noble"
        - name: gnome-extensions-session-check
          kind: assert
          spec:
            command: "command -v gnome-extensions >/dev/null && gnome-extensions list >/dev/null 2>&1"
            message: "Run this module from inside the logged-in GNOME session (needs gnome-shell on the session D-Bus)"

    - name: gext-cli
      description: "gnome-extensions-cli (gext) via pipx"
      dependsOn: [host-check]
      steps:
        - name: gext-cli-install
          kind: tool-packages
          spec:
            backend: pipx
            packages: [gnome-extensions-cli]
            probeCommand: "test -x $HOME/.local/bin/gext"

    - name: gext-install
      description: "Install and enable the GNOME Shell extensions (leaf phase)"
      dependsOn: [gext-cli]
      execution: { continueOnError: true }
      steps:
        - name: gext-user-theme
          kind: commands
          spec:
            probeCommand: "{ test -f $HOME/.local/share/gnome-shell/extensions/user-theme@gnome-shell-extensions.gcampax.github.com/metadata.json || test -f /usr/share/gnome-shell/extensions/user-theme@gnome-shell-extensions.gcampax.github.com/metadata.json; } && gsettings get org.gnome.shell enabled-extensions | grep -qF \"'user-theme@gnome-shell-extensions.gcampax.github.com'\""
            commands:
              - name: user-theme
                # -F = filesystem backend: unpack + enable via gsettings, no GNOME Shell confirmation dialog
                run: '"$HOME/.local/bin/gext" -F install user-theme@gnome-shell-extensions.gcampax.github.com'
                unless: "{ test -f $HOME/.local/share/gnome-shell/extensions/user-theme@gnome-shell-extensions.gcampax.github.com/metadata.json || test -f /usr/share/gnome-shell/extensions/user-theme@gnome-shell-extensions.gcampax.github.com/metadata.json; } && gsettings get org.gnome.shell enabled-extensions | grep -qF \"'user-theme@gnome-shell-extensions.gcampax.github.com'\""
                timeout: 5m
        - name: gext-battery-indicator-icon
          kind: commands
          spec:
            probeCommand: "{ test -f $HOME/.local/share/gnome-shell/extensions/battery-indicator-icon@Deminder/metadata.json || test -f /usr/share/gnome-shell/extensions/battery-indicator-icon@Deminder/metadata.json; } && gsettings get org.gnome.shell enabled-extensions | grep -qF \"'battery-indicator-icon@Deminder'\""
            commands:
              - name: battery-indicator-icon
                # -F = filesystem backend: unpack + enable via gsettings, no GNOME Shell confirmation dialog
                run: '"$HOME/.local/bin/gext" -F install battery-indicator-icon@Deminder'
                unless: "{ test -f $HOME/.local/share/gnome-shell/extensions/battery-indicator-icon@Deminder/metadata.json || test -f /usr/share/gnome-shell/extensions/battery-indicator-icon@Deminder/metadata.json; } && gsettings get org.gnome.shell enabled-extensions | grep -qF \"'battery-indicator-icon@Deminder'\""
                timeout: 5m
        - name: gext-notification-icons
          kind: commands
          spec:
            probeCommand: "{ test -f $HOME/.local/share/gnome-shell/extensions/notification-icons@muhammad_ans.github/metadata.json || test -f /usr/share/gnome-shell/extensions/notification-icons@muhammad_ans.github/metadata.json; } && gsettings get org.gnome.shell enabled-extensions | grep -qF \"'notification-icons@muhammad_ans.github'\""
            commands:
              - name: notification-icons
                # -F = filesystem backend: unpack + enable via gsettings, no GNOME Shell confirmation dialog
                run: '"$HOME/.local/bin/gext" -F install notification-icons@muhammad_ans.github'
                unless: "{ test -f $HOME/.local/share/gnome-shell/extensions/notification-icons@muhammad_ans.github/metadata.json || test -f /usr/share/gnome-shell/extensions/notification-icons@muhammad_ans.github/metadata.json; } && gsettings get org.gnome.shell enabled-extensions | grep -qF \"'notification-icons@muhammad_ans.github'\""
                timeout: 5m
        - name: gext-tophat
          kind: commands
          spec:
            probeCommand: "{ test -f $HOME/.local/share/gnome-shell/extensions/tophat@fflewddur.github.io/metadata.json || test -f /usr/share/gnome-shell/extensions/tophat@fflewddur.github.io/metadata.json; } && gsettings get org.gnome.shell enabled-extensions | grep -qF \"'tophat@fflewddur.github.io'\""
            commands:
              - name: tophat
                # -F = filesystem backend: unpack + enable via gsettings, no GNOME Shell confirmation dialog
                run: '"$HOME/.local/bin/gext" -F install tophat@fflewddur.github.io'
                unless: "{ test -f $HOME/.local/share/gnome-shell/extensions/tophat@fflewddur.github.io/metadata.json || test -f /usr/share/gnome-shell/extensions/tophat@fflewddur.github.io/metadata.json; } && gsettings get org.gnome.shell enabled-extensions | grep -qF \"'tophat@fflewddur.github.io'\""
                timeout: 5m
        - name: gext-space-bar
          kind: commands
          spec:
            probeCommand: "{ test -f $HOME/.local/share/gnome-shell/extensions/space-bar@luchrioh/metadata.json || test -f /usr/share/gnome-shell/extensions/space-bar@luchrioh/metadata.json; } && gsettings get org.gnome.shell enabled-extensions | grep -qF \"'space-bar@luchrioh'\""
            commands:
              - name: space-bar
                # -F = filesystem backend: unpack + enable via gsettings, no GNOME Shell confirmation dialog
                run: '"$HOME/.local/bin/gext" -F install space-bar@luchrioh'
                unless: "{ test -f $HOME/.local/share/gnome-shell/extensions/space-bar@luchrioh/metadata.json || test -f /usr/share/gnome-shell/extensions/space-bar@luchrioh/metadata.json; } && gsettings get org.gnome.shell enabled-extensions | grep -qF \"'space-bar@luchrioh'\""
                timeout: 5m
        - name: gext-alphabetical-app-grid
          kind: commands
          spec:
            probeCommand: "{ test -f $HOME/.local/share/gnome-shell/extensions/AlphabeticalAppGrid@stuarthayhurst/metadata.json || test -f /usr/share/gnome-shell/extensions/AlphabeticalAppGrid@stuarthayhurst/metadata.json; } && gsettings get org.gnome.shell enabled-extensions | grep -qF \"'AlphabeticalAppGrid@stuarthayhurst'\""
            commands:
              - name: alphabetical-app-grid
                # -F = filesystem backend: unpack + enable via gsettings, no GNOME Shell confirmation dialog
                run: '"$HOME/.local/bin/gext" -F install AlphabeticalAppGrid@stuarthayhurst'
                unless: "{ test -f $HOME/.local/share/gnome-shell/extensions/AlphabeticalAppGrid@stuarthayhurst/metadata.json || test -f /usr/share/gnome-shell/extensions/AlphabeticalAppGrid@stuarthayhurst/metadata.json; } && gsettings get org.gnome.shell enabled-extensions | grep -qF \"'AlphabeticalAppGrid@stuarthayhurst'\""
                timeout: 5m
