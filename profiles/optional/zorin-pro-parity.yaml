# zorin-pro-parity.yaml - the 35 flatpaks that Zorin OS 18 Pro preinstalls (optional module).
#
# Run alone:   ./bootstrap.sh --only zorin-pro-parity
# Use it on:   Zorin OS Core/Education, or after a reinstall without the Pro image, to get the same app set.
#              On Zorin Pro every app is already present, so every item is a no-op.
# Caveats:     - System-wide flatpak installs: run from the local GNOME session (polkit), not over SSH.
#              - The list is split into three leaf phases (~12 apps each) with continueOnError, so one broken
#                or withdrawn app only marks its own phase failed and the other two still run.
#              - Some IDs overlap with profiles/60-desktop-apps.yaml (Audacity, Kdenlive, Inkscape, ...);
#                flatpak skips apps that are already installed.
apiVersion: initkit.io/v1alpha1
kind: WorkstationProfile
metadata:
  name: zorin-zorin-pro-parity
  labels: { distro: zorin, module: zorin-pro-parity }
spec:
  target:
    os: { distribution: ubuntu, codename: noble, release: "24.04" }
  phases:
    - name: host-check
      steps:
        - name: zorin-pro-parity-host-check
          kind: assert
          spec:
            command: "command -v apt-get >/dev/null && grep -q '^VERSION_CODENAME=noble' /etc/os-release"
            message: "This profile targets Zorin OS 18 / Ubuntu 24.04 noble"

    - name: flathub
      description: "Make sure the system-wide flathub remote exists (remote-add --if-not-exists)"
      dependsOn: [host-check]
      steps:
        - name: zorin-pro-parity-flathub-remote
          kind: flatpak-remote
          spec:
            remote: flathub
            url: https://flathub.org/repo/flathub.flatpakrepo
            checksum:
              algorithm: sha256
              value: 3371dd250e61d9e1633630073fefda153cd4426f72f4afa0c3373ae2e8fea03a

    - name: pro-productivity
      description: "Zorin Pro apps: productivity, reading, utilities (leaf phase)"
      dependsOn: [host-check, flathub]
      execution: { continueOnError: true }
      steps:
        - name: zorin-pro-flatpaks-productivity
          kind: flatpak-packages
          spec:
            remote: flathub
            apps:
              - app.drey.Warp
              - be.alexandervanhee.gradia
              - com.github.finefindus.eyedropper
              - com.github.johnfactotum.Foliate
              - com.github.phase1geo.minder
              - com.logseq.Logseq
              - com.odnoyko.valot
              - fr.free.Homebank
              - io.github.alainm23.planify
              - io.gitlab.news_flash.NewsFlash
              - org.gnome.Solanum
              - org.gnome.World.Secrets

    - name: pro-media
      description: "Zorin Pro apps: audio and video (leaf phase)"
      dependsOn: [host-check, flathub]
      execution: { continueOnError: true }
      steps:
        - name: zorin-pro-flatpaks-media
          kind: flatpak-packages
          spec:
            remote: flathub
            apps:
              - com.github.wwmm.easyeffects
              - com.obsproject.Studio
              - com.rafaelmardojai.Blanket
              - de.haeckerfelix.Fragments
              - fr.handbrake.ghb
              - io.github.revisto.drum-machine
              - org.ardour.Ardour
              - org.audacityteam.Audacity
              - org.kde.kdenlive
              - org.mixxx.Mixxx
              - org.videolan.VLC
              - org.gnome.NetworkDisplays

    - name: pro-creative
      description: "Zorin Pro apps: graphics, 3D, publishing, writing (leaf phase)"
      dependsOn: [host-check, flathub]
      execution: { continueOnError: true }
      steps:
        - name: zorin-pro-flatpaks-creative
          kind: flatpak-packages
          spec:
            remote: flathub
            apps:
              - com.github.xournalpp.xournalpp
              - io.github.OpenToonz
              - io.gitlab.theevilskeleton.Upscaler
              - net.scribus.Scribus
              - org.blender.Blender
              - org.darktable.Darktable
              - org.deskflow.deskflow
              - org.freecad.FreeCAD
              - org.gnome.gitlab.somas.Apostrophe
              - org.inkscape.Inkscape
              - org.kde.krita
