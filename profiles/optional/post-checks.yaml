# post-checks.yaml - verification and manual follow-ups (optional module; run after the re-login that
# 90-session asks for).
#
# Run alone:   ./bootstrap.sh --only post-checks
# Contents:    - verify: assert steps (docker group + daemon, zsh login shell, VictorMono Nerd Font, neovim,
#                key CLI binaries, Vicinae server answering, Vicinae extension active). Each is its own leaf
#                phase so every check reports independently; the session-bound ones (docker group, extension)
#                say on stderr whether only a log out/in is missing or the install itself is (shown with
#                ./bootstrap.sh --only post-checks --show-output).
#              - manual steps with probes: gh login, SSH key, duplicate Telegram flatpak removed. They pass once
#                the probe succeeds; until then they fail with the instruction in the message.
# Caveats:     - `docker run --rm hello-world` pulls a tiny image from Docker Hub (network needed).
#              - Nothing here changes the system; a failure only means "go fix this" and the run can be repeated.
#              - Checks run with bash -lc, so ~/.profile PATH applies; binstaller tools in ~/.apps/<tool>/bin and
#                cargo tools in ~/.cargo/bin are also accepted when they are not on that PATH.
apiVersion: initkit.io/v1alpha1
kind: WorkstationProfile
metadata:
  name: ubuntu-post-checks
  labels: { distro: ubuntu, module: post-checks }
spec:
  target:
    os: { distribution: ubuntu, codename: resolute, release: "26.04" }
  phases:
    - name: host-check
      steps:
        - name: post-checks-host-check
          kind: assert
          spec:
            command: "command -v apt-get >/dev/null && grep -q '^VERSION_CODENAME=resolute' /etc/os-release"
            message: "This profile targets Ubuntu 26.04 resolute"

    - name: verify-docker-group
      dependsOn: [host-check]
      steps:
        - name: post-docker-group
          kind: assert
          spec:
            command: >-
              id -nG | grep -qw docker && exit 0;
              if id -nG "$USER" | grep -qw docker; then echo "$USER is in the docker group, but this session started before it was added" >&2;
              else echo "$USER is not in the docker group at all (run ./bootstrap.sh --only docker)" >&2; fi;
              exit 1
            message: "Current session is not in the docker group: log out and back in (or reboot) after 90-session"

    - name: verify-docker-run
      dependsOn: [host-check]
      steps:
        - name: post-docker-hello-world
          kind: assert
          spec:
            command: "docker run --rm hello-world >/dev/null"
            message: "docker run hello-world failed: check 'systemctl status docker' and docker group membership"

    - name: verify-login-shell
      dependsOn: [host-check]
      steps:
        - name: post-zsh-login-shell
          kind: assert
          spec:
            command: "getent passwd \"$USER\" | grep -q '/zsh$'"
            message: "Login shell is not zsh: run 'chsh -s /usr/bin/zsh' or ./bootstrap.sh --only session"

    - name: verify-fonts
      dependsOn: [host-check]
      steps:
        - name: post-victormono-nerd-font
          kind: assert
          spec:
            command: "fc-list | grep -qi 'VictorMono Nerd'"
            message: "VictorMono Nerd Font missing: run ./bootstrap.sh --only binaries (nerd fonts)"

    - name: verify-neovim
      dependsOn: [host-check]
      steps:
        - name: post-neovim
          kind: assert
          spec:
            command: "if command -v nvim >/dev/null; then nvim --version | head -1; else \"$HOME/.apps/neovim/bin/nvim\" --version | head -1; fi"
            message: "neovim is not runnable: run ./bootstrap.sh --only binaries"

    - name: verify-binaries
      dependsOn: [host-check]
      steps:
        - name: post-key-binaries
          kind: assert
          spec:
            command: >-
              missing="";
              for t in cargo-binstall eza just dotbot kubectl; do
              command -v "$t" >/dev/null 2>&1 || test -x "$HOME/.apps/$t/bin/$t" || test -x "$HOME/.cargo/bin/$t" || missing="$missing $t";
              done;
              if [ -n "$missing" ]; then echo "missing:$missing" >&2; exit 1; fi
            message: "Key CLI binaries missing (see output): run ./bootstrap.sh --only toolchains and --only binaries"

    - name: verify-vicinae-server
      dependsOn: [host-check]
      steps:
        - name: post-vicinae-server
          kind: assert
          spec:
            command: "/usr/local/bin/vicinae ping >/dev/null"
            message: "Vicinae: the server does not answer. Check: systemctl --user status vicinae (or ./bootstrap.sh --only vicinae)"

    - name: verify-vicinae-extension
      dependsOn: [host-check]
      steps:
        - name: post-vicinae-extension-active
          kind: assert
          spec:
            # A running Wayland shell never picks up an extension unpacked after it started, so "installed and
            # enabled but unknown to this shell" means: log out/in. Anything else means the install is broken.
            command: >-
              gnome-extensions info vicinae@dagimg-dot 2>/dev/null | grep -Eq 'State: (ACTIVE|ENABLED)' && exit 0;
              if test -f "$HOME/.local/share/gnome-shell/extensions/vicinae@dagimg-dot/metadata.json" &&
              gsettings get org.gnome.shell enabled-extensions | grep -qF "'vicinae@dagimg-dot'"; then
              echo "vicinae@dagimg-dot is installed and enabled; the running shell loads it after the next log out/in" >&2;
              else echo "vicinae@dagimg-dot is not installed or not enabled (run ./bootstrap.sh --only vicinae)" >&2; fi;
              exit 1
            message: "Vicinae: the GNOME extension is not active in this session. Log out/in after ./bootstrap.sh --only vicinae"

    - name: manual-gh-auth
      dependsOn: [host-check]
      steps:
        - name: post-manual-gh-auth
          kind: manual
          spec:
            message: "Run: gh auth login"
            probeCommand: "gh auth status >/dev/null 2>&1"

    - name: manual-ssh-key
      dependsOn: [host-check]
      steps:
        - name: post-manual-ssh-key
          kind: manual
          spec:
            message: "Create an SSH key and register it: ssh-keygen -t ed25519 then gh ssh-key add ~/.ssh/id_ed25519.pub"
            probeCommand: "test -f $HOME/.ssh/id_ed25519.pub"

    - name: manual-telegram-duplicate
      dependsOn: [host-check]
      steps:
        - name: post-manual-telegram-duplicate
          kind: manual
          spec:
            message: "Telegram is installed twice (snap + flatpak); remove the flatpak: flatpak uninstall org.telegram.desktop"
            probeCommand: "! flatpak info org.telegram.desktop >/dev/null 2>&1"
