# 90-session.yaml - module "session"
#
# Final session-level changes; always the LAST module of ./bootstrap.sh:
#   - login shell -> /usr/bin/zsh (already zsh on this host, so the typed probe skips it)
#   - add the user to the docker, libvirt and kvm groups
#   - prompt-logout: when this phase changed something (first run), the run stops here (exit 75) and asks
#     you to log out and back in; a converged run (nothing to change, or --re-probe) carries on without asking
#
# Run alone:  ./bootstrap.sh --only session
#
# Caveats:
#   - The groups are created by docker-ce (20-docker) and libvirt-daemon-system (00-base). If
#     either is missing, session-groups fails, the phase is recorded as failed and the logout
#     prompt is NOT shown. Fix the missing module, then re-run this one.
#   - Group membership and the new login shell only apply to new login sessions.
apiVersion: initkit.io/v1alpha1
kind: WorkstationProfile
metadata:
  name: ubuntu-session
  labels: { distro: ubuntu, module: session }
spec:
  target:
    os: { distribution: ubuntu, codename: resolute, release: "26.04" }
  phases:
    - name: host-check
      description: "Refuse to run anywhere but Ubuntu 26.04 resolute"
      steps:
        - name: session-host-check
          kind: assert
          spec:
            command: "command -v apt-get >/dev/null && grep -q '^VERSION_CODENAME=resolute' /etc/os-release"
            message: "This profile targets Ubuntu 26.04 resolute"

    - name: session
      description: "Login shell and group memberships, then ask for a logout"
      dependsOn: [host-check]
      restartPolicy:
        type: prompt-logout
        message: "Log out and back in (or reboot) so the docker/libvirt/kvm groups and the zsh login shell take effect. Then run: ./bootstrap.sh --only post-checks"
      steps:
        - name: session-login-shell
          kind: default-shell
          spec:
            shell: /usr/bin/zsh
        - name: session-groups
          kind: user-groups
          execution: { continueOnError: true }
          spec:
            groups: [docker, libvirt, kvm]
