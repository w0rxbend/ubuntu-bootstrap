# 70-gnome.yaml - module "gnome"
#
# GNOME desktop settings for Ubuntu 26.04 (GNOME 50), carried over from the old bootstrap (POSIX rewrite of the
# zsh-only gsettings block):
#   - Ubuntu Dock "hot-keys" off: ubuntu-dock@ubuntu.com (a dash-to-dock build, schema
#     org.gnome.shell.extensions.dash-to-dock, enabled by default with hot-keys=true) grabs Super+1..9 and
#     Shift+Super+1..9 for launching pinned apps
#   - 9 fixed (non-dynamic) workspaces
#   - Super+N switches to workspace N, Super+Shift+N moves the window to workspace N
#     (GNOME's switch-to-application-N bindings are cleared so they do not clash)
#   - Screenshot UI on Super+Print and Print
#   - Dock favourites as pinned on this host (Brave, Files, App Center, Ghostty, Ptyxis, Telegram,
#     Vesktop, ChatGPT, Claude, Paseo); runs after apps (10), shell (50, ghostty) and desktop-apps (60,
#     telegram-desktop snap: the host pins the org.telegram.desktop flatpak, which the bootstrap replaces by the
#     snap), so the IDs exist. Only written when Vesktop is not pinned yet, so later hand edits are kept.
#
# Run alone:  ./bootstrap.sh --only gnome
#
# Caveats:
#   - Must run inside the logged-in GNOME session (gsettings needs the session D-Bus); the
#     gnome-session-check assert fails fast otherwise (e.g. over SSH or from a TTY).
#   - No tiling / Arch desktop pieces (niri, PaperWM, dash-to-dock, tilingshell) are configured; Ubuntu Dock and
#     tiling-assistant keep their Ubuntu defaults apart from the dock hot-keys.
#   - GNOME extensions themselves are handled by the optional profile gnome-extensions.
apiVersion: initkit.io/v1alpha1
kind: WorkstationProfile
metadata:
  name: ubuntu-gnome
  labels: { distro: ubuntu, module: gnome }
spec:
  target:
    os: { distribution: ubuntu, codename: resolute, release: "26.04" }
  phases:
    - name: host-check
      description: "Ubuntu 26.04 / resolute, running inside a GNOME session"
      execution: { continueOnError: false }
      steps:
        - name: gnome-host-check
          kind: assert
          spec:
            command: "command -v apt-get >/dev/null && grep -q '^VERSION_CODENAME=resolute' /etc/os-release"
            message: "This profile targets Ubuntu 26.04 resolute"
        - name: gnome-session-check
          kind: assert
          spec:
            command: "command -v gsettings >/dev/null && test -n \"$DBUS_SESSION_BUS_ADDRESS\""
            message: "Run from the logged-in GNOME session"

    - name: gnome-settings
      description: "Fixed workspaces and workspace keybindings"
      dependsOn: [host-check]
      steps:
        - name: gnome-workspaces-keybindings
          kind: shell-scripts
          spec:
            shell: bash
            scripts:
              - name: gnome-workspaces-keybindings
                content: |
                  set -euo pipefail
                  # Ubuntu Dock (dash-to-dock schema, enabled by default) grabs Super+1..9 and Shift+Super+1..9
                  # for pinned apps ("hot-keys"); free them for workspaces. A missing schema is skipped.
                  schema=org.gnome.shell.extensions.dash-to-dock
                  if gsettings list-keys "$schema" 2>/dev/null | grep -qx hot-keys; then
                    gsettings set "$schema" hot-keys false
                  fi
                  gsettings set org.gnome.mutter dynamic-workspaces false
                  gsettings set org.gnome.desktop.wm.preferences num-workspaces 9
                  for i in 1 2 3 4 5 6 7 8 9; do
                    gsettings set org.gnome.shell.keybindings "switch-to-application-$i" "[]"
                    gsettings set org.gnome.desktop.wm.keybindings "switch-to-workspace-$i" "['<Super>$i']"
                    gsettings set org.gnome.desktop.wm.keybindings "move-to-workspace-$i" "['<Super><Shift>$i']"
                  done
                  gsettings set org.gnome.shell.keybindings show-screenshot-ui "['<Super>Print', 'Print']"
                timeout: 2m
            # Also fails while Ubuntu Dock still grabs Super+N, or GNOME's switch-to-application-N does.
            probeCommand: "test \"$(gsettings get org.gnome.desktop.wm.preferences num-workspaces)\" = 9 && gsettings get org.gnome.mutter dynamic-workspaces | grep -qx false && gsettings get org.gnome.desktop.wm.keybindings switch-to-workspace-9 | grep -qF \"'<Super>9'\" && gsettings get org.gnome.desktop.wm.keybindings move-to-workspace-9 | grep -qF \"'<Super><Shift>9'\" && gsettings get org.gnome.shell.keybindings switch-to-application-1 | grep -qF '[]' && ! gsettings get org.gnome.shell.extensions.dash-to-dock hot-keys 2>/dev/null | grep -qx true"
        - name: gnome-favorite-apps
          kind: commands
          description: "Pinned apps, as set by hand on this host"
          spec:
            commands:
              - name: favorite-apps
                run: "gsettings set org.gnome.shell favorite-apps \"['brave_brave.desktop', 'org.gnome.Nautilus.desktop', 'snap-store_snap-store.desktop', 'ghostty_ghostty.desktop', 'org.gnome.Ptyxis.desktop', 'telegram-desktop_telegram-desktop.desktop', 'dev.vencord.Vesktop.desktop', 'chatgpt.desktop', 'com.anthropic.Claude.desktop', 'paseo.desktop']\""
                timeout: 1m
            probeCommand: "gsettings get org.gnome.shell favorite-apps | grep -q Vesktop"
