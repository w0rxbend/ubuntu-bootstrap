# 60-desktop-apps.yaml - module "desktop-apps"
#
# GUI applications and user-level app installers:
#   - flatpak itself (apt) and the flathub system remote: Ubuntu ships neither (it defaults to snaps)
#   - 51 flatpaks from flathub, split into 8 independent category phases
#   - 20 snaps, as installed by hand on this host: brave, telegram-desktop, vesktop-tsugu, zulip,
#     slack, spotify, mailspring, beekeeper-studio, onlyoffice-desktopeditors, zenkit-todo, glab, and
#     (classic) sublime-text, theia-ide, workshop, waveterm, jupyterlab-desktop, antigravity,
#     antigravity-ide-snap, flutter, skuberplus-client
#   - AI CLIs: Claude Code, OpenAI Codex, Kimi Code
#   - home-dir apps: Zed (zed.dev installer) and the Paseo AppImage, laid out the way Gear Lever
#     integrated it on this host (~/AppImages/paseo.appimage, icon in ~/AppImages/.icons, launcher
#     ~/.local/share/applications/paseo.desktop with the paseo:// handler, ~/.local/bin/paseo link)
#
# Run alone:  ./bootstrap.sh --only desktop-apps
#
# IMPORTANT: run this from the logged-in, local GNOME session (not over SSH). The flatpak
# installs are system-wide and polkit only authorizes them without a password for members of
# the sudo group in an *active local* session.
#
# Notes:
#   - Every category is a leaf phase with continueOnError, so one broken app never blocks others.
#   - org.gnome.Boxes and it.mijorus.gearlever were installed by hand on this host.
#   - Deliberately excluded: com.oguzhaninan.Stacer (gone from flathub; apt stacer in 00-base),
#     com.brave.Browser (Brave is the brave snap on this host), dev.zed.Zed (Zed comes from
#     zed.dev/install.sh below), org.telegram.desktop, org.zulip.Zulip, dev.vencord.Vesktop and
#     com.spotify.Client (the telegram-desktop, zulip, vesktop-tsugu and spotify snaps are used),
#     app.devsuite.Ptyxis (Ubuntu 26.04 ships Ptyxis as its default terminal, org.gnome.Ptyxis).
#   - claude-desktop and chatgpt are apt packages in 10-apps.
apiVersion: initkit.io/v1alpha1
kind: WorkstationProfile
metadata:
  name: ubuntu-desktop-apps
  labels: { distro: ubuntu, module: desktop-apps }
spec:
  target:
    os: { distribution: ubuntu, codename: resolute, release: "26.04" }
  phases:
    - name: host-check
      description: "Refuse to run anywhere but Ubuntu 26.04 resolute"
      steps:
        - name: desktop-apps-host-check
          kind: assert
          spec:
            command: "command -v apt-get >/dev/null && grep -q '^VERSION_CODENAME=resolute' /etc/os-release"
            message: "This profile targets Ubuntu 26.04 resolute"

    - name: flathub
      description: "flatpak (apt; not preinstalled on Ubuntu) and the Flathub system remote (remote-add --if-not-exists)"
      dependsOn: [host-check]
      steps:
        - name: flatpak-apt
          kind: apt-packages
          spec:
            packages: [flatpak]
        - name: flathub-remote
          kind: flatpak-remote
          spec:
            remote: flathub
            url: https://flathub.org/repo/flathub.flatpakrepo
            checksum: { algorithm: sha256, value: 3371dd250e61d9e1633630073fefda153cd4426f72f4afa0c3373ae2e8fea03a }

    - name: flatpak-browsers
      dependsOn: [host-check, flathub]
      execution: { continueOnError: true }
      steps:
        - name: flatpak-browsers
          kind: flatpak-packages
          spec:
            remote: flathub
            apps:
              - io.gitlab.librewolf-community
              - com.google.Chrome
              - app.zen_browser.zen

    - name: flatpak-communication
      dependsOn: [host-check, flathub]
      execution: { continueOnError: true }
      steps:
        - name: flatpak-communication
          kind: flatpak-packages
          spec:
            remote: flathub
            apps:
              - com.discordapp.Discord

    - name: flatpak-media
      dependsOn: [host-check, flathub]
      execution: { continueOnError: true }
      steps:
        - name: flatpak-media
          kind: flatpak-packages
          spec:
            remote: flathub
            apps:
              - org.audacityteam.Audacity
              - org.kde.audiotube
              - io.github.hrkfdn.ncspot
              - org.gnome.Decibels
              - io.bassi.Amberol
              - com.github.neithern.g4music

    - name: flatpak-graphics
      dependsOn: [host-check, flathub]
      execution: { continueOnError: true }
      steps:
        - name: flatpak-graphics
          kind: flatpak-packages
          spec:
            remote: flathub
            apps:
              - org.kde.kdenlive
              - org.inkscape.Inkscape
              - org.kde.krita
              - org.blender.Blender
              - org.freecad.FreeCAD
              - org.godotengine.Godot
              - org.librecad.librecad
              - com.bambulab.BambuStudio
              - io.github.nokse22.Exhibit

    - name: flatpak-writing
      dependsOn: [host-check, flathub]
      execution: { continueOnError: true }
      steps:
        - name: flatpak-writing
          kind: flatpak-packages
          spec:
            remote: flathub
            apps:
              - io.gitlab.liferooter.TextPieces
              - org.gnome.gitlab.somas.Apostrophe
              - org.gnome.gitlab.ilhooq.Bookup
              - page.codeberg.censor.Censor
              - com.logseq.Logseq

    - name: flatpak-dev
      dependsOn: [host-check, flathub]
      execution: { continueOnError: true }
      steps:
        - name: flatpak-dev
          kind: flatpak-packages
          spec:
            remote: flathub
            apps:
              - org.wezfurlong.wezterm
              - com.vscodium.codium

    - name: flatpak-system
      dependsOn: [host-check, flathub]
      execution: { continueOnError: true }
      steps:
        - name: flatpak-system
          kind: flatpak-packages
          spec:
            remote: flathub
            apps:
              - com.mattjakeman.ExtensionManager
              - com.github.tchx84.Flatseal
              - io.github.giantpinkrobots.flatsweep
              - io.github.flattool.Warehouse
              - net.nokyan.Resources
              - page.tesk.Refine
              - io.missioncenter.MissionCenter
              - be.alexandervanhee.gradia
              - io.github.mrvladus.List
              - com.belmoussaoui.Authenticator
              - org.gnome.Polari
              - org.gnome.dspy
              - io.github.swordpuffin.rewaita
              - org.gnome.design.Emblem
              - org.mozilla.vpn
              - io.github.zingytomato.netpeek
              - org.gnome.Boxes             # hand-installed on this host (system scope)
              - it.mijorus.gearlever        # hand-installed on this host (system scope; AppImage manager)

    - name: flatpak-productivity
      dependsOn: [host-check, flathub]
      execution: { continueOnError: true }
      steps:
        - name: flatpak-productivity
          kind: flatpak-packages
          spec:
            remote: flathub
            apps:
              - com.pojtinger.felicitas.Sessions
              - com.rafaelmardojai.Blanket
              - io.github.nozwock.Packet
              - org.localsend.localsend_app
              - io.gitlab.news_flash.NewsFlash
              - io.github.diegopvlk.Dosage
              - dev.Cogitri.Health

    - name: snaps
      description: "Snaps installed by hand on this host (ghostty lives in 50-shell, code and crystal in 10-apps)"
      dependsOn: [host-check]
      execution: { continueOnError: true }
      steps:
        - name: snap-strict
          kind: tool-packages
          spec:
            backend: snap
            packages:
              - brave
              - telegram-desktop
              - vesktop-tsugu
              - zulip
              - slack
              - spotify
              - mailspring
              - beekeeper-studio
              - onlyoffice-desktopeditors
              - zenkit-todo
              - glab
            probeCommand: "snap list brave >/dev/null 2>&1 && snap list telegram-desktop >/dev/null 2>&1 && snap list vesktop-tsugu >/dev/null 2>&1 && snap list zulip >/dev/null 2>&1 && snap list slack >/dev/null 2>&1 && snap list spotify >/dev/null 2>&1 && snap list mailspring >/dev/null 2>&1 && snap list beekeeper-studio >/dev/null 2>&1 && snap list onlyoffice-desktopeditors >/dev/null 2>&1 && snap list zenkit-todo >/dev/null 2>&1 && snap list glab >/dev/null 2>&1"
        - name: snap-sublime-text
          kind: commands
          spec:
            commands:
              - name: sublime-text
                run: "snap install sublime-text --classic"
                sudo: true
                unless: "snap list sublime-text >/dev/null 2>&1"
                timeout: 15m
            probeCommand: "snap list sublime-text >/dev/null 2>&1"
        - name: snap-theia-ide
          kind: commands
          spec:
            commands:
              - name: theia-ide
                run: "snap install theia-ide --classic"
                sudo: true
                unless: "snap list theia-ide >/dev/null 2>&1"
                timeout: 15m
            probeCommand: "snap list theia-ide >/dev/null 2>&1"
        - name: snap-workshop
          kind: commands
          spec:
            commands:
              - name: workshop
                run: "snap install workshop --classic"
                sudo: true
                unless: "snap list workshop >/dev/null 2>&1"
                timeout: 15m
            probeCommand: "snap list workshop >/dev/null 2>&1"
        - name: snap-waveterm
          kind: commands
          spec:
            commands:
              - name: waveterm
                run: "snap install waveterm --classic"
                sudo: true
                unless: "snap list waveterm >/dev/null 2>&1"
                timeout: 15m
            probeCommand: "snap list waveterm >/dev/null 2>&1"
        - name: snap-jupyterlab-desktop
          kind: commands
          spec:
            commands:
              - name: jupyterlab-desktop
                run: "snap install jupyterlab-desktop --classic"
                sudo: true
                unless: "snap list jupyterlab-desktop >/dev/null 2>&1"
                timeout: 15m
            probeCommand: "snap list jupyterlab-desktop >/dev/null 2>&1"
        - name: snap-antigravity
          kind: commands
          spec:
            commands:
              - name: antigravity
                run: "snap install antigravity --classic"
                sudo: true
                unless: "snap list antigravity >/dev/null 2>&1"
                timeout: 15m
            probeCommand: "snap list antigravity >/dev/null 2>&1"
        - name: snap-antigravity-ide-snap
          kind: commands
          spec:
            commands:
              - name: antigravity-ide-snap
                run: "snap install antigravity-ide-snap --classic"
                sudo: true
                unless: "snap list antigravity-ide-snap >/dev/null 2>&1"
                timeout: 15m
            probeCommand: "snap list antigravity-ide-snap >/dev/null 2>&1"
        - name: snap-flutter
          kind: commands
          spec:
            commands:
              - name: flutter
                run: "snap install flutter --classic"
                sudo: true
                unless: "snap list flutter >/dev/null 2>&1"
                timeout: 15m
            probeCommand: "snap list flutter >/dev/null 2>&1"
        - name: snap-skuberplus-client
          kind: commands
          spec:
            commands:
              - name: skuberplus-client
                run: "snap install skuberplus-client --classic"
                sudo: true
                unless: "snap list skuberplus-client >/dev/null 2>&1"
                timeout: 15m
            probeCommand: "snap list skuberplus-client >/dev/null 2>&1"

    - name: ai-tools
      description: "AI coding CLIs from their vendors' installers"
      dependsOn: [host-check]
      execution: { continueOnError: true }
      steps:
        - name: claude-code
          kind: commands
          spec:
            commands:
              - name: claude-code-install
                run: "curl -fsSL https://claude.ai/install.sh | bash"
                creates: ${HOME}/.local/bin/claude
                timeout: 10m
            probeCommand: "test -x $HOME/.local/bin/claude"
        - name: codex-cli
          kind: commands
          spec:
            commands:
              - name: codex-install
                run: "curl -fsSL https://chatgpt.com/codex/install.sh | sh"
                creates: ${HOME}/.local/bin/codex
                timeout: 10m
            probeCommand: "test -x $HOME/.local/bin/codex"
        - name: kimi-code
          kind: commands
          spec:
            commands:
              # bash, not zsh: the zsh variant failed on this host
              - name: kimi-code-install
                run: "curl -fsSL https://code.kimi.com/kimi-code/install.sh | bash"
                creates: ${HOME}/.kimi-code/bin/kimi
                timeout: 10m
            probeCommand: "test -x $HOME/.kimi-code/bin/kimi"

    - name: home-apps
      description: "Apps installed into the home directory: Zed and the Paseo AppImage"
      dependsOn: [host-check]
      execution: { continueOnError: true }
      steps:
        - name: zed
          kind: commands
          spec:
            commands:
              - name: zed-install
                run: "curl -f https://zed.dev/install.sh | sh"
                creates: ${HOME}/.local/zed.app/bin/zed
                timeout: 10m
            probeCommand: "test -x $HOME/.local/zed.app/bin/zed"
        # Same layout Gear Lever produced on this host, so Gear Lever keeps managing it and the
        # paseo.desktop GNOME favourite (70-gnome) resolves. The probe matches the existing file,
        # so no second copy is downloaded.
        - name: paseo
          kind: shell-scripts
          spec:
            shell: bash
            scripts:
              - name: paseo-appimage
                timeout: 10m
                content: |
                  set -euo pipefail
                  dir="$HOME/AppImages"
                  app="$dir/paseo.appimage"
                  apps_dir="$HOME/.local/share/applications"
                  mkdir -p "$dir/.icons" "$HOME/.local/bin" "$apps_dir"
                  if [ ! -x "$app" ]; then
                    curl -fL -o "$app.part" https://github.com/getpaseo/paseo/releases/latest/download/Paseo-x86_64.AppImage
                    chmod +x "$app.part"
                    mv -f "$app.part" "$app"
                  fi
                  ln -sfn "$app" "$HOME/.local/bin/paseo"
                  # Icon: best effort, extracted from the AppImage (.DirIcon is a symlink inside it).
                  if [ ! -s "$dir/.icons/paseo" ]; then
                    tmp="$(mktemp -d)"
                    trap 'rm --recursive --force "$tmp"' EXIT
                    if (cd "$tmp" && "$app" --appimage-extract .DirIcon >/dev/null 2>&1); then
                      target="$(readlink "$tmp/squashfs-root/.DirIcon" || true)"
                      if [ -n "$target" ]; then
                        (cd "$tmp" && "$app" --appimage-extract "$target" >/dev/null 2>&1) || true
                      fi
                      cp -L "$tmp/squashfs-root/.DirIcon" "$dir/.icons/paseo" 2>/dev/null || true
                    fi
                  fi
                  icon="$dir/.icons/paseo"
                  [ -s "$icon" ] || icon=paseo
                  # An existing launcher (e.g. Gear Lever's, with its X-AppImage-* keys) is kept.
                  if [ ! -f "$apps_dir/paseo.desktop" ]; then
                  cat >"$apps_dir/paseo.desktop" <<EOF
                  [Desktop Entry]
                  Type=Application
                  Name=Paseo
                  Comment=Paseo desktop app (Electron wrapper)
                  Icon=$icon
                  TryExec=$app
                  Exec=$app --class=Paseo %U
                  Terminal=false
                  MimeType=x-scheme-handler/paseo;
                  Categories=Development;
                  StartupWMClass=Paseo
                  EOF
                  fi
                  if command -v update-desktop-database >/dev/null 2>&1; then
                    update-desktop-database "$apps_dir" || true
                  fi
            probeCommand: "test -x $HOME/AppImages/paseo.appimage && test -f $HOME/.local/share/applications/paseo.desktop && test -e $HOME/.local/bin/paseo"
