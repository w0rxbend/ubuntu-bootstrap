# 80-dotfiles - clone/update the live dotfiles repo, link the dotfiles with dotbot, install tmux plugins,
# set up the broot launcher.
#
# Run alone:   ./bootstrap.sh --only dotfiles      (or: just dotfiles)
#
# Where the dotfiles come from:
#   - github.com/w0rxbend/system-bootstrap is the source of truth. It is cloned over https to ~/.system-bootstrap
#     (pushurl = SSH), and an existing clone is only ever fast-forwarded (scripts/system-bootstrap-sync.sh).
#   - dotfiles/system-bootstrap.conf.yaml links the shared files from ~/.system-bootstrap/.files (no copies here).
#   - dotfiles/install.conf.yaml links the Ubuntu-only files kept in this repo (system-update script, kitty
#     terminal lists, session env, the ~/.custom.zsh overlay, agent skills).
#   - scripts/dotfiles-link.sh backs up every real file/dir at a link target to ~/.ubuntu-bootstrap-backup/
#     (same relative path) and then runs dotbot once per config.
#
# Caveats:
# - fluxion's `dotfiles-apply` kind takes a single config (and before fluxion 0.4.2 it passed `--config`,
#   which dotbot-go v0.4.2 rejects), so dotbot is run from `shell-scripts` steps, once per config.
# - The probes (`--check` modes of the two scripts) decide whether a step runs the first time, and under
#   --re-probe. Under --skip-already-installed (what bootstrap.sh passes) a recorded item is skipped from state:
#   the clone is then only fast-forwarded by `just dotfiles-pull` or `--re-probe`, while the link step re-runs
#   whenever its inputs change (the digest in its item name, see below).
# - dotbot runs with force: true, but only after the backup, so nothing in $HOME is lost.
# - This profile runs late on purpose: installers that append to ~/.zshrc (pnpm, codex, kimi, ...)
#   have already run and edited the throwaway template, not the linked file in ~/.system-bootstrap.
apiVersion: initkit.io/v1alpha1
kind: WorkstationProfile
metadata:
  name: ubuntu-dotfiles
  labels: { distro: ubuntu, module: dotfiles }
spec:
  target:
    os: { distribution: ubuntu, codename: resolute, release: "26.04" }
  vars:
    repoDir: ${HOME}/.ubuntu-bootstrap
    # Digest of the dotbot inputs (both configs + scripts/dotfiles-link.sh), exported by bootstrap.sh. The
    # environment wins over this fallback, which only applies to a direct `fluxion apply`.
    ZB_DOTFILES_INPUTS: direct-run
  phases:
    - name: host-check
      steps:
        - name: dotfiles-host-check
          kind: assert
          spec:
            # /usr/bin/python3, not python3: PyYAML comes from apt (python3-yaml, 00-base), and the shell that runs
            # bootstrap.sh may put another python3 first on PATH (miniforge's base env, via conda init in ~/.zshrc,
            # from 30-toolchains on), which has no yaml. fluxion inherits that PATH.
            command: "command -v apt-get >/dev/null && grep -q '^VERSION_CODENAME=resolute' /etc/os-release && command -v git >/dev/null && /usr/bin/python3 -c 'import yaml'"
            message: "This profile targets Ubuntu 26.04 resolute and needs git + python3-yaml (00-base)"

    - name: system-bootstrap-clone
      description: "Clone github.com/w0rxbend/system-bootstrap to ~/.system-bootstrap (https), else fast-forward only"
      dependsOn: [host-check]
      execution: { continueOnError: false }
      steps:
        - name: dotfiles-system-bootstrap-clone
          kind: shell-scripts
          spec:
            shell: bash
            scripts:
              - name: system-bootstrap-sync
                content: |
                  set -euo pipefail
                  exec bash "$1/scripts/system-bootstrap-sync.sh"
                args: ["${repoDir}"]
                timeout: 10m
            # Satisfied when the clone exists and already contains the remote HEAD (read-only ls-remote).
            probeCommand: '"$HOME/.ubuntu-bootstrap/scripts/system-bootstrap-sync.sh" --check'

    - name: dotbot
      description: "Back up what is in the way, then link ~/.system-bootstrap/.files and dotfiles/ with dotbot-go"
      dependsOn: [system-bootstrap-clone]
      execution: { continueOnError: false }
      steps:
        - name: dotbot-apply
          kind: shell-scripts
          spec:
            shell: bash
            scripts:
              # The item name carries the digest of the dotbot inputs. fluxion skips a recorded item from state
              # under --skip-already-installed and fingerprints this phase without looking at the dotbot
              # configs, so with a fixed name an edited config was never linked by ./bootstrap.sh (only by
              # `just dotfiles`). A changed digest is a new item: it is probed (links already right -> skip) and
              # otherwise run. Unchanged inputs keep the recorded item, so a re-run changes nothing.
              - name: dotbot-links-${ZB_DOTFILES_INPUTS}
                # dotbot resolution: $DOTBOT_BIN -> PATH -> binstaller copy in ~/.apps -> fluxion's verified
                # pinned download (v0.4.2) in ~/.cache/fluxion/tools.
                content: |
                  set -euo pipefail
                  exec bash "$1/scripts/dotfiles-link.sh"
                args: ["${repoDir}"]
                timeout: 10m
            probeCommand: '"$HOME/.ubuntu-bootstrap/scripts/dotfiles-link.sh" --check'

    - name: tmux-plugins
      description: "Install tmux plugins declared in ~/.tmux.conf via TPM (tmux from base, TPM from shell)"
      dependsOn: [dotbot]
      execution: { continueOnError: true }
      steps:
        - name: tmux-plugins-install
          kind: commands
          spec:
            commands:
              - name: tpm-install-plugins
                run: '"$HOME/.tmux/plugins/tpm/bin/install_plugins"'
                unless: "test -d $HOME/.tmux/plugins/tmux-sensible"
                timeout: 5m
            probeCommand: "test -d $HOME/.tmux/plugins/tmux-sensible"

    - name: broot-launcher
      description: "Write the broot `br` shell function (sourced by .zshrc); no rc-file edits"
      dependsOn: [host-check]
      execution: { continueOnError: true }
      steps:
        - name: broot-launcher
          kind: commands
          spec:
            commands:
              - name: broot-br-function
                # Written via a temp file so a failed/missing broot never leaves an empty `br` behind
                # (which `creates:` would then treat as done).
                run: 'd="$HOME/.config/broot/launcher/bash" && mkdir -p "$d" && broot --print-shell-function bash > "$d/br.tmp" && mv -f "$d/br.tmp" "$d/br" && broot --set-install-state installed'
                creates: ${HOME}/.config/broot/launcher/bash/br
            probeCommand: "test -s $HOME/.config/broot/launcher/bash/br"
