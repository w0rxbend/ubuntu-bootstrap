# 10-apps.yaml -- module "apps"
#
# Third-party desktop/CLI apps that were installed by hand on this host, reproduced
# declaratively. Every app is its own leaf phase, so one broken vendor repo never blocks
# the others:
#   gh (GitHub CLI repo), claude-desktop (Anthropic repo), VS Code (`code` classic snap),
#   1Password (1Password repo), ChatGPT desktop (.deb), fastfetch (.deb from GitHub),
#   Crystal (`crystal` classic snap, which also provides `shards`).
#
# Run alone:   ./bootstrap.sh --only apps
# Caveats:
#   - gh and claude-desktop use apt-repository and write the SAME .list files that already
#     exist on this host. Since fluxion 0.4.0 (f992d37) the apt-repository probe compares the
#     .list with the declared `source` line and requires a non-empty keyring, so a
#     hand-written/vendor claude-desktop.list (the postinst's `signed-by=...asc` line) is
#     rewritten to the declared one. Fluxion always `gpg --dearmor`s keys, therefore the
#     claude-desktop keyring is a .gpg file; apps-claude-desktop-key pins its fingerprint (the
#     gpg-key probe checks it). The package's postinst still rewrites
#     /usr/share/keyrings/claude-desktop-archive-keyring.asc on every install/upgrade; that file
#     is harmless. Our claude-desktop.list has no
#     "### Managed by the claude-desktop package." marker, so the postinst leaves it alone and
#     it keeps pointing at the dearmored .gpg.
#   - 1Password keeps its vendor deb822 .sources file (the package postinst owns it). It is
#     written byte-identical to what the package writes, with the key installed by gpg-key at
#     the same keyring path, so apt never sees conflicting Signed-By values.
#   - VS Code and Crystal are snaps, as installed by hand on this host (no Microsoft or OBS apt
#     repo). Both are classic snaps; snap refreshes them. The crystal snap is 1.21.1 at the time
#     of writing, new enough to build fluxion (>= 1.21).
#   - file-writes steps are probed by existence only: with --skip-already-installed an
#     existing .sources file is left untouched even if its content differs.
#   - ChatGPT has no public key URL (the key ships inside the .deb, whose postinst adds
#     chatgpt.sources), so it is installed from the vendor .deb; later updates come via apt.
#   - fastfetch: the upstream .deb (latest release) is installed rather than the older resolute archive build
#     (update it by re-running with --re-probe after removing it, or via the upstream release page).
#   - Crystal: `crystal-lang.org/install.sh | sudo zsh` wrote a broken apt source on this host; 00-base
#     moves it aside. Never install Ubuntu's own `crystal`/`shards` packages next to the snap: /usr/bin
#     comes before /snap/bin on PATH, so they would shadow it.
#   - Brave (the brave snap on this host) is intentionally not managed here.
apiVersion: initkit.io/v1alpha1
kind: WorkstationProfile
metadata:
  name: ubuntu-apps
  labels: { distro: ubuntu, module: apps }
spec:
  target:
    os: { distribution: ubuntu, codename: resolute, release: "26.04" }
  phases:
    - name: host-check
      description: "Refuse to run anywhere but Ubuntu 26.04 resolute"
      steps:
        - name: apps-host-check
          kind: assert
          spec:
            command: "command -v apt-get >/dev/null && grep -q '^VERSION_CODENAME=resolute' /etc/os-release"
            message: "This profile targets Ubuntu 26.04 resolute"

    # fluxion's gpg-key kind reads each downloaded key with `gpg --batch --no-options --show-keys`, and with
    # --no-options gpg refuses to create a missing ~/.gnupg ("Fatal: ~/.gnupg: directory does not exist!"), so
    # on a fresh install (no ~/.gnupg yet) every gpg-key step failed. Create it the way gpg itself would (0700).
    - name: gnupg-home
      description: "~/.gnupg exists (0700) before the gpg-key steps read their keys"
      dependsOn: [host-check]
      steps:
        - name: apps-gnupg-home
          kind: commands
          spec:
            commands:
              - name: gnupg-home
                run: "install -d -m 0700 \"$HOME/.gnupg\""
                creates: ${HOME}/.gnupg
            probeCommand: "test -d $HOME/.gnupg"

    - name: gh
      description: "GitHub CLI from cli.github.com"
      dependsOn: [host-check]
      execution: { continueOnError: false }
      steps:
        - name: apps-gh-repo
          kind: apt-repository
          spec:
            source: deb [arch=amd64 signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main
            sourceList: /etc/apt/sources.list.d/github-cli.list
            signingKeyUrl: https://cli.github.com/packages/githubcli-archive-keyring.gpg
            keyring: /etc/apt/keyrings/githubcli-archive-keyring.gpg
            checksum: { algorithm: sha256, value: 6084d5d7bd8e288441e0e94fc6275570895da18e6751f70f057485dc2d1a811b }
        - name: apps-gh
          kind: apt-packages
          spec:
            packages: [gh]

    - name: claude-desktop
      description: "Claude desktop app from downloads.claude.ai (pulls in qemu/ovmf/virtiofsd)"
      dependsOn: [host-check, gnupg-home]
      execution: { continueOnError: false }
      steps:
        - name: apps-claude-desktop-key
          kind: gpg-key
          spec:
            keys:
              - url: https://downloads.claude.ai/claude-desktop/key.asc
                fingerprint: 31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE
                keyring: /usr/share/keyrings/claude-desktop-archive-keyring.gpg
        - name: apps-claude-desktop-repo
          kind: apt-repository
          spec:
            source: deb [arch=amd64 signed-by=/usr/share/keyrings/claude-desktop-archive-keyring.gpg] https://downloads.claude.ai/claude-desktop/apt/stable stable main
            sourceList: /etc/apt/sources.list.d/claude-desktop.list
            signingKeyUrl: https://downloads.claude.ai/claude-desktop/key.asc
            keyring: /usr/share/keyrings/claude-desktop-archive-keyring.gpg
            checksum: { algorithm: sha256, value: bd70a5e4a268002704024ceba7f8446024114e94f3f0bdd11c23a9e592be81c6 }
        - name: apps-claude-desktop
          kind: apt-packages
          spec:
            packages: [claude-desktop]

    - name: vscode
      description: "Visual Studio Code (classic snap `code`)"
      dependsOn: [host-check]
      execution: { continueOnError: false }
      steps:
        - name: apps-vscode
          kind: commands
          spec:
            commands:
              - name: code-snap
                run: "snap install code --classic"
                sudo: true
                unless: "snap list code >/dev/null 2>&1"
                timeout: 15m
            probeCommand: "snap list code >/dev/null 2>&1"

    - name: onepassword
      description: "1Password desktop app from downloads.1password.com (deb822 source, same as the package writes)"
      dependsOn: [host-check, gnupg-home]
      execution: { continueOnError: false }
      steps:
        - name: apps-1password-key
          kind: gpg-key
          spec:
            keys:
              - url: https://downloads.1password.com/linux/keys/1password.asc
                fingerprint: 3FEF9748469ADBE15DA7CA80AC2D62742012EA22
                keyring: /usr/share/keyrings/1password-archive-keyring.gpg
        - name: apps-1password-source
          kind: file-writes
          spec:
            files:
              - name: 1password.sources
                destination: /etc/apt/sources.list.d/1password.sources
                mode: "0644"
                content: |
                  # This file is automatically added and configured by the 1Password package. Modifications may be overwritten.
                  Types: deb
                  URIs: https://downloads.1password.com/linux/debian/amd64
                  Suites: stable
                  Components: main
                  Architectures: amd64
                  Signed-By: /usr/share/keyrings/1password-archive-keyring.gpg
        - name: apps-1password
          kind: apt-packages
          spec:
            # The step probe only gates `apt-get update` (the package keeps its dpkg probe): the new source's
            # index is needed only to install 1password, so skip the update once it is installed.
            probeCommand: "dpkg -s 1password 2>/dev/null | grep -qx 'Status: install ok installed'"
            actions: [update]
            packages: [1password]

    - name: chatgpt
      description: "ChatGPT desktop app (.deb; its postinst adds chatgpt.sources for updates)"
      dependsOn: [host-check]
      execution: { continueOnError: false }
      steps:
        - name: apps-chatgpt
          kind: commands
          spec:
            commands:
              - name: chatgpt-deb
                sudo: true
                timeout: 15m
                unless: "dpkg -s chatgpt >/dev/null 2>&1"
                run: 'set -euo pipefail; d=$(mktemp -d); trap ''find "$d" -delete'' EXIT; curl -fsSL -o "$d/chatgpt_amd64.deb" https://persistent.oaistatic.com/codex-app-prod/linux/deb/latest/chatgpt_amd64.deb; chmod 0755 "$d"; chmod 0644 "$d/chatgpt_amd64.deb"; apt-get install -y "$d/chatgpt_amd64.deb"'
            probeCommand: "dpkg -s chatgpt >/dev/null 2>&1"

    - name: fastfetch
      description: "fastfetch (.deb from the upstream GitHub release; newer than the resolute archive build)"
      dependsOn: [host-check]
      execution: { continueOnError: false }
      steps:
        - name: apps-fastfetch
          kind: commands
          spec:
            commands:
              - name: fastfetch-deb
                sudo: true
                timeout: 10m
                unless: "dpkg -s fastfetch >/dev/null 2>&1"
                run: 'set -euo pipefail; d=$(mktemp -d); trap ''find "$d" -delete'' EXIT; curl -fsSL -o "$d/fastfetch-linux-amd64.deb" https://github.com/fastfetch-cli/fastfetch/releases/latest/download/fastfetch-linux-amd64.deb; chmod 0755 "$d"; chmod 0644 "$d/fastfetch-linux-amd64.deb"; apt-get install -y "$d/fastfetch-linux-amd64.deb"'
            probeCommand: "dpkg -s fastfetch >/dev/null 2>&1"

    - name: crystal
      description: "Crystal compiler and shards (classic snap `crystal`)"
      dependsOn: [host-check]
      execution: { continueOnError: false }
      steps:
        - name: apps-crystal
          kind: commands
          spec:
            commands:
              - name: crystal-snap
                run: "snap install crystal --classic"
                sudo: true
                unless: "snap list crystal >/dev/null 2>&1"
                timeout: 15m
            probeCommand: "snap list crystal >/dev/null 2>&1"
