# All 42 Nerd Font families, in the original system-bootstrap order.
# dotbot-linked to ~/.config/nerd-fonts-installer/config.yaml for manual reruns:
#   nerd-fonts-installer --config ~/.config/nerd-fonts-installer/config.yaml
# fluxion does NOT use this file: it installs the same families in 4 batches
# (01-core, 02-more, 03-rest, 04-noto) because the nerd-fonts kind has a fixed
# 15 min timeout. Keep this list and the batch files in sync.
# nerd-fonts-installer v1.0.7 config. Installs into ~/.local/share/fonts/NerdFonts.
release: latest
destination: ~/.local/share/fonts/NerdFonts
refresh_font_cache: true
families:
  - JetBrainsMono
  - MPlus
  - Terminus
  - FantasqueSansMono
  - Noto
  - Hack
  - HeavyData
  - "3270"
  - FiraCode
  - LiberationMono
  - RobotoMono
  - Mononoki
  - Ubuntu
  - DroidSansMono
  - Monoid
  - SpaceMono
  - SourceCodePro
  - ComicShannsMono
  - NerdFontsSymbolsOnly
  - DaddyTimeMono
  - UbuntuMono
  - Meslo
  - FiraMono
  - CodeNewRoman
  - CascadiaCode
  - Hasklig
  - DejaVuSansMono
  - ZedMono
  - Inconsolata
  - Hermit
  - CommitMono
  - Agave
  - GeistMono
  - Monaspace
  - ShareTechMono
  - Recursive
  - D2Coding
  - EnvyCodeR
  - IosevkaTerm
  - Lekton
  - Lilex
  - VictorMono
