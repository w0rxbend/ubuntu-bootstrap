# Nerd Fonts batch 3/4 (fluxion step nerd-fonts-rest, profiles/40-binaries.yaml).
# nerd-fonts-installer v1.0.7 config. Installs into ~/.local/share/fonts/NerdFonts.
# The full list (all 42 families, one file) is the system-bootstrap clone's
# .files/.config/nerd-fonts-installer/config.yaml, linked to ~/.config/nerd-fonts-installer/.
# The four batches together must match it (tests/assertions/binaries.sh checks this).
release: latest
destination: ~/.local/share/fonts/NerdFonts
refresh_font_cache: true
families:
  - Hasklig
  - DejaVuSansMono
  - Inconsolata
  - Hermit
  - Agave
  - Monaspace
  - ShareTechMono
  - Recursive
  - D2Coding
  - EnvyCodeR
  - IosevkaTerm
  - Lekton
  - Lilex
